name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify spidermonkey.go attestation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify bridge file (release attestation)
        run: make verify

  test:
    name: Go test
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  test262:
    name: test262 conformance
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: TEST262=1 go test . -run TestTest262 -v -timeout 3h

  examples:
    name: Example (${{ matrix.example }})
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        example: [nodejs, jose, hono, nextjs]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable pnpm
      - name: Set up example (install deps; build where needed)
        working-directory: examples/${{ matrix.example }}
        run: make setup
      - name: Test example
        working-directory: examples/${{ matrix.example }}
        run: make test

  wpt:
    name: Web Platform Tests
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Resolve the WPT submodule pin
        id: wpt-pin
        run: echo "sha=$(git ls-tree HEAD testdata/wpt/suite --object-only)" >> "$GITHUB_OUTPUT"
      - name: Cache the pinned WPT checkout
        uses: actions/cache@v4
        with:
          path: testdata/wpt/suite
          key: wpt-${{ steps.wpt-pin.outputs.sha }}-${{ hashFiles('Makefile') }}
      - run: make wpt

  nodetest:
    name: Node.js test suite
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Resolve the Node submodule pin
        id: node-pin
        run: echo "sha=$(git ls-tree HEAD testdata/node/suite --object-only)" >> "$GITHUB_OUTPUT"
      - name: Cache the pinned Node checkout
        uses: actions/cache@v4
        with:
          path: testdata/node/suite
          key: nodetest-${{ steps.node-pin.outputs.sha }}-${{ hashFiles('Makefile') }}
      - run: make nodetest

  babeltest:
    name: Babel fixture corpus
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve the Babel submodule pin
        id: babel-pin
        run: echo "sha=$(git ls-tree HEAD testdata/babel/suite --object-only)" >> "$GITHUB_OUTPUT"
      - name: Cache the pinned Babel checkout and its packages
        uses: actions/cache@v4
        with:
          path: |
            testdata/babel/suite
            testdata/babel/node_modules
          key: babeltest-${{ steps.babel-pin.outputs.sha }}-${{ hashFiles('Makefile', 'scripts/babel-suite-deps.sh') }}
      - run: make babeltest
